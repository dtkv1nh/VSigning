<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VSigning - Viết Blog</title>

    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/editor.css">

</head>
<body>

    <div class="banner">
        <input type="file" accept="image/*" id="banner-upload" hidden >
        <label for="banner-upload" class="banner-upload-btn"><img src="https://lh3.googleusercontent.com/drive-viewer/AKGpihafkLAKi8BM_87jVvepoJ4NkAQ4PCaWsLtA_azpC-TdQgh_kQ9WGjJAJRF_N8-iGaKEzKbNErT_Q_x1LT-ajvM4IicXeyp54w=s2560" alt="upload banner"></label>
    </div>
    
    <div class="blog">
        <textarea type="text" class="title" placeholder="Tiêu đề của blog..."></textarea>
        <textarea type="text" class="article" placeholder="Bắt đầu viết..."></textarea>
    </div>

    <div class="blog-options">
        <button class="btn dark publish-btn">Đăng bài</button>
        <input type="file" accept="image/*" id="image-upload" hidden>
        <label for="image-upload" class="btn grey upload-btn">Thêm hình ảnh</label>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.9.1/firebase-firestore.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/editor.js"></script>

</body>
</html>
